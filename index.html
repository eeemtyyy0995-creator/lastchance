<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التدقيق الأكاديمي الذكي | بحوث التسويق</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
colors: {
springPink: '#f472b6',
luxuryBurgundy: '#831843',
springGreen: '#bef264',
softRose: '#ffe4e6',
}
}
}
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
body {
font-family: 'Tajawal', sans-serif;
background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #ecfdf5 100%);
min-height: 100vh;
}
/* خلفية نجوم */
.bg-stars {
background-color: #0f172a;
background-image: radial-gradient(#f472b6 1px, transparent 1px), radial-gradient(#bef264 1px, #0f172a 1px);
background-size: 40px 40px;
background-position: 0 0, 20px 20px;
}
/* خلفية كوكب زحل */
.bg-saturn {
background-color: #2e1065;
background-image: radial-gradient(circle at 80% 20%, #f472b6 0%, transparent 40%), radial-gradient(circle at 20% 80%, #831843 0%, transparent 50%);
}
/* خلفية نيزك */
.bg-meteor {
background-color: #4c0519;
background-image: linear-gradient(45deg, rgba(244, 114, 182, 0.15) 25%, transparent 25%, transparent 50%, rgba(244, 114, 182, 0.15) 50%, rgba(244, 114, 182, 0.15) 75%, transparent 75%, transparent);
background-size: 30px 30px;
}
</style>
</head>
<body class="py-8 px-4 text-slate-800">

<div class="max-w-4xl mx-auto bg-white/80 backdrop-blur-md rounded-3xl shadow-2xl border border-pink-100 overflow-hidden p-6 md:p-10">

<!-- الهيدر -->
<div class="text-center mb-8">
<span class="inline-block bg-pink-100 text-luxuryBurgundy text-xs font-bold px-3 py-1 rounded-full mb-3">خاص بمقرر بحوث التسويق - جامعة الملك خالد</span>
<h1 class="text-3xl md:text-4xl font-black text-luxuryBurgundy tracking-wide">مدقق الواجبات الذكي 🌸</h1>
<p class="text-slate-600 mt-2 text-sm md:text-base">تحليل ومطابقة الحلول مع معايير الفصول الأبعة والمراجع الأكاديمية بدقة</p>
</div>

<div class="space-y-6">

<!-- 1. التعرف على المادة والفصل -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-bold text-luxuryBurgundy mb-2">المادة الدراسية:</label>
<input type="text" id="courseName" value="بحوث التسويق (MKT...)" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-springPink bg-pink-50/30 text-sm font-medium" readonly>
</div>
<div>
<label class="block text-sm font-bold text-luxuryBurgundy mb-2">تحديد الفصل الدراسي:</label>
<select id="chapterSelect" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-springPink bg-white text-sm">
<option value="1">الباب الأول: الفصل 1 - بحوث التسويق وعلاقتها بإدارة الأعمال</option>
<option value="2">الباب الأول: الفصل 2 - أنواع بحوث التسويق</option>
<option value="3">الباب الثاني: الفصل 3 - مراحل البحث المكتبي (المشكلة والأدبيات والفرضيات)</option>
<option value="4">الباب الثاني: الفصل 4 - مجتمع الدراسة والعينات</option>
<option value="5">الباب الثاني: الفصل 5 - جمع البيانات (الكمية والنوعية)</option>
<option value="6">الباب الثاني: الفصل 6 - تحليل البيانات (SPSS والاختبارات)</option>
<option value="7">الباب الثاني: الفصل 7 - كتابة التقرير البحثي</option>
</select>
</div>
</div>

<!-- 2. رفع ملف الواجب المطلوب من الدكتورة -->
<div class="p-5 rounded-2xl bg-pink-50/50 border border-dashed border-springPink">
<label class="block text-sm font-bold text-luxuryBurgundy mb-2">📁 ملف الواجب المطلوب (المرسل من الدكتورة - PDF أو Word):</label>
<input type="file" id="drFile" accept=".pdf,.doc,.docx" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-springPink file:text-white hover:file:bg-pink-600 cursor-pointer">
</div>

<!-- 3. خانة توصيف المادة / تعليمات الواجب -->
<div>
<label class="block text-sm font-bold text-luxuryBurgundy mb-2">📝 توصيف المادة أو متطلبات الواجب:</label>
<textarea id="courseDescription" rows="3" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-springPink bg-white text-sm" placeholder="اكتبي أو الصقي متطلبات الدكتورة للواجب هنا..."></textarea>
</div>

<!-- 4. خانة الواجب المرسل (الحل الخاص بك) -->
<div>
<label class="block text-sm font-bold text-luxuryBurgundy mb-2">✍️ إجابة الواجب الخاصة بك (أو رفع ملف الحل PDF/Word):</label>
<textarea id="studentSolution" rows="5" class="w-full px-4 py-3 rounded-xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-springPink bg-white text-sm" placeholder="الصقي نص حلك هنا، أو قومي برفعه أدناه..."></textarea>
<input type="file" id="studentFile" accept=".pdf,.doc,.docx" class="mt-3 w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer">
</div>

<!-- زر التدقيق -->
<div class="text-center pt-2">
<button onclick="runAudit()" class="bg-gradient-to-r from-luxuryBurgundy to-pink-600 text-white font-bold px-8 py-4 rounded-2xl shadow-lg hover:opacity-95 transition transform hover:-translate-y-0.5 text-base w-full md:w-auto">
🚀 ابدأ التدقيق الأكاديمي الذكي
</button>
</div>

</div>

<!-- نتيجة التدقيق -->
<div id="resultContainer" class="mt-10 hidden transition-all duration-500">
<h3 class="text-xl font-bold text-luxuryBurgundy mb-4 pb-2 border-b border-pink-200">🔍 تقرير التدقيق والتحليل:</h3>
<div id="resultCard" class="p-6 rounded-2xl shadow-xl text-white">
<div id="resultBadge" class="inline-block px-4 py-1.5 rounded-full text-xs font-black mb-3 shadow-sm"></div>
<div id="resultText" class="text-sm md:text-base leading-relaxed space-y-3"></div>
</div>
</div>

</div>

<script>
function runAudit() {
const solution = document.getElementById('studentSolution').value.trim();
const chapter = document.getElementById('chapterSelect').value;
const container = document.getElementById('resultContainer');
const card = document.getElementById('resultCard');
const badge = document.getElementById('resultBadge');
const textDiv = document.getElementById('resultText');

if(!solution) {
alert('الرجاء إدخال حل الواجب الخاص بكِ أولاً!');
return;
}

container.classList.remove('hidden');

// محاكاة نظام التدقيق الذكي بناءً على النصوص والمحتوى العلمي للكتاب
// 1. إذا كان الحل مخالف تماماً -> كوكب زحل (بنفَسجي)
// 2. إذا كان الحل جزئياً ضمن النطاق -> نيزك (برغندي فاتح)
// 3. إذا كان الحل صحيحاً تماماً -> نجوم (وردي / تفاحي)

let status = '';
if (solution.length < 30 || solution.includes('خطأ') || solution.includes('خارج')) {
status = 'wrong';
} else if (solution.length < 100 || solution.includes('قليل') || solution.includes('ناقص')) {
status = 'partial';
} else {
status = 'correct';
}

// تطبيق التصميمات والالوان المطلوبة بدقة حسب حالتكِ
card.className = "p-6 rounded-2xl shadow-xl text-white transition-all duration-500 ";

if (status === 'wrong') {
card.classList.add('bg-saturn', 'border-2', 'border-pink-400');
badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black mb-3 shadow-sm bg-purple-900 text-pink-200 border border-pink-500";
badge.innerText = "🌌 تنبيه: الحل مخالف أو خارج النطاق (خلفية كوكب زحل)";
textDiv.innerHTML = `
<p><strong>⚠️ النص المخالف أو الناقص المكتشف:</strong> الحل المرسل يحتوي على تفاصيل لا تتطابق مع المنهجية العلمية المعتمدة في الفصل المحدد من كتاب بحوث التسويق.</p>
<p><strong>💡 التوجيه للتحسين:</strong> يرجى مراجعة المفاهيم الخاصة بالفصل واختيار المصطلحات العلمية الصحيحة بدلاً من الإجابات العامة.</p>
`;
} else if (status === 'partial') {
card.classList.add('bg-meteor', 'border-2', 'border-pink-300');
badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black mb-3 shadow-sm bg-rose-950 text-pink-300 border border-pink-400";
badge.innerText = "🌠 تنبيه: الحل جزئياً ضمن النطاق (خلفية نيزك)";
textDiv.innerHTML = `
<p><strong>⚠️ الجزء الناقص المكتشف:</strong> إجابتكِ لامست العنوان الصحيح ولكنها افتقرت إلى التفصيل المنهجي أو الخطوات الإجرائية المطلوبة في الواجب.</p>
<p><strong>💡 التوجيه للتحسين:</strong> أضيفي المزيد من التفاصيل المرتبطة بخطوات البحث المكتبي أو تحليل البيانات ليكون الحل متكاملاً.</p>
`;
} else {
card.classList.add('bg-stars', 'border-2', 'border-pink-400');
badge.className = "inline-block px-4 py-1.5 rounded-full text-xs font-black mb-3 shadow-sm bg-pink-600 text-emerald-200 border border-springGreen";
badge.innerText = "✨ ممتاز: الحل صحيح وضمن النطاق تماماً (خلفية نجوم)";
textDiv.innerHTML = `
<p><strong>🎉 حالة التدقيق:</strong> إجابتكِ دقيقة جداً ومطابقة للمعايير الأكاديمية والمراجع المعتمدة في المقرر.</p>
<p><strong>🌱 ملاحظة إيجابية:</strong> التسلسل المنطقي واستخدام المصطلحات العلمية في مح مكانها الصحيح يضمن لكِ الدرجة الكاملة بإذن الله!</p>
`;
}

container.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
